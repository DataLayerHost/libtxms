name: Submit libtxms to ConanCenter
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CONAN_CENTER_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, for example 0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: conan-center-libtxms
  cancel-in-progress: false
jobs:
  submit:
    if: vars.CONAN_CENTER_FORK != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      FORK: ${{ vars.CONAN_CENTER_FORK }}
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'conan>=2.12,<3'
      - run: conan profile detect --force
      - name: Download and verify published sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A stable published release is required") else true end'
          gh release download "$TAG" --dir dist --pattern "libtxms-${TAG}.tar.gz" --pattern SHA256SUMS --pattern release.json
          python tools/verify_release.py --tag "$TAG" --directory dist
      - name: Prepare and test recipe
        run: |
          version="${TAG}"
          python tools/prepare_conan_center.py --version "$version" --archive "dist/libtxms-$version.tar.gz"
          python tools/check_conan_center.py --version "$version" --archive "dist/libtxms-$version.tar.gz" --recipe release-stage/recipes/libtxms/all
      - name: Open or update ConanCenter pull request
        env:
          GH_TOKEN: ${{ secrets.CONAN_CENTER_TOKEN }}
        run: python tools/submit_conan_center.py --fork "$FORK" --version "${TAG}" --stage release-stage
